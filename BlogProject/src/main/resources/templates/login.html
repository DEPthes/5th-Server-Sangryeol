<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | My Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }

        .login-card{
            max-width:480px;
            margin:90px auto;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .logo{
            font-size:2.3rem;
            font-weight:700;
            color:#0d6efd;
        }

        .subtitle{
            color:#6c757d;
            margin-bottom:35px;
        }

        .form-control{
            height:52px;
            border-radius:10px;
        }

        .btn-login{
            height:50px;
            border-radius:10px;
            font-weight:600;
        }

        .btn-signup{
            height:50px;
            border-radius:10px;
            font-weight:600;
        }

        hr{
            margin:30px 0;
        }
    </style>

</head>
<body>

<div class="container">
    <div class="card login-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="logo">
                    My Blog
                </div>
                <div class="subtitle">
                    블로그에 오신 것을 환영합니다.
                </div>
            </div>

            <!-- 로그인 실패 -->
            <div th:if="${param.error}" class="alert alert-danger text-center">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>

            <!-- 로그아웃 -->
            <div th:if="${param.logout}" class="alert alert-success text-center">
                로그아웃되었습니다.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        이메일
                    </label>
                    <input
                            type="email"
                            name="username"
                            class="form-control"
                            placeholder="example@email.com"
                            required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        비밀번호
                    </label>
                    <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="비밀번호를 입력하세요"
                            required>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100">로그인</button>
            </form>

            <hr>

            <div class="text-center">
                <p class="text-muted mb-3">
                    아직 계정이 없으신가요?
                </p>
                <a th:href="@{/signup}" class="btn btn-outline-secondary btn-signup w-100">
                    회원가입
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
