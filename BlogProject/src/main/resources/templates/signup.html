<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | My Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fa;
        }

        .signup-card{
            max-width:520px;
            margin:70px auto;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .logo{
            font-size:2.3rem;
            font-weight:700;
            color:#0d6efd;
        }

        .subtitle{
            color:#6c757d;
            margin-bottom:35px;
        }

        .form-control{
            height:52px;
            border-radius:10px;
        }

        .btn-signup{
            height:50px;
            border-radius:10px;
            font-weight:600;
        }

        .btn-login{
            height:50px;
            border-radius:10px;
            font-weight:600;
        }

        hr{
            margin:30px 0;
        }

    </style>
</head>
<body>
<div class="container">
    <div class="card signup-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="logo">
                    My Blog
                </div>
                <div class="subtitle">
                    회원가입 후 블로그를 이용해보세요.
                </div>
            </div>

            <!-- 회원가입 실패 시 -->
            <div th:if="${errorMessage}"
                 class="alert alert-danger text-center"
                 th:text="${errorMessage}">
            </div>

            <form th:action="@{/user}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        닉네임
                    </label>
                    <input
                            type="text"
                            class="form-control"
                            name="nickname"
                            placeholder="닉네임을 입력하세요"
                            required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        이메일
                    </label>
                    <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="example@email.com"
                            required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        비밀번호
                    </label>
                    <input
                            type="password"
                            class="form-control"
                            name="password"
                            placeholder="비밀번호를 입력하세요"
                            required>
                </div>
                <button type="submit" class="btn btn-primary btn-signup w-100">회원가입</button>
            </form>

            <hr>

            <div class="text-center">
                <p class="text-muted mb-3">
                    이미 계정이 있으신가요?
                </p>
                <a th:href="@{/login}" class="btn btn-outline-secondary btn-login w-100">
                    로그인
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
